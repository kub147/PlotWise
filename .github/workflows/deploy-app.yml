# Builds the PlotWise app (app/) and publishes it to GitHub Pages.
# One-time setup by the repository owner: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    # The app bundles copies of these folders at build time (app/scripts/sync-data.mjs).
    paths:
      - 'app/**'
      - 'data/processed/**'
      - 'docs/img/**'
      - 'crops-economics/reference/evidence.md'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # "npm run build" first copies the data (prebuild), then type-checks and bundles into app/build.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
